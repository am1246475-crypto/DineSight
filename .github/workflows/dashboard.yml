name: dashboard
on:
  pull_request:
    paths: ["src/dashboard/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: src/dashboard/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
